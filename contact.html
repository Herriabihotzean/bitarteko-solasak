<!DOCTYPE html>
<html data-title-eu="Gurekin harremanetan jarri" data-title-fr="Nous contacter" lang="fr">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>
   Nous contacter
  </title>
  <style>
   *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:26px 12px;font-family:Georgia,"Times New Roman",serif;color:white;background:linear-gradient(rgba(0,0,0,.48),rgba(0,0,0,.58)),url("Un dimanche d'été à Ascain.jpeg") center/cover fixed;}main{width:min(720px,97%);margin:0 auto;padding:30px;border-radius:14px;background:rgba(20,55,32,.95);box-shadow:0 8px 28px rgba(0,0,0,.48)}h1{margin-top:0;text-align:center}.introduction{text-align:center;line-height:1.55}.champ{margin-bottom:17px}label{display:block;margin-bottom:6px;font-weight:bold}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #ccc;border-radius:6px;font:inherit}textarea{min-height:170px;resize:vertical}button{display:block;width:100%;padding:14px;border:0;border-radius:8px;background:#f6f3ea;color:rgb(20,55,32);font:inherit;font-weight:bold;cursor:pointer}button:hover{background:#ffe9a8}#messageEtat{min-height:24px;text-align:center;font-weight:bold}.retour{display:block;margin-top:24px;color:white;text-align:center}@media(max-width:520px){body{padding:8px 4px;background-attachment:scroll}main{width:99%;padding:22px 14px}}
  </style>
  <link href="langues.css" rel="stylesheet"/>
 </head>
 <body>
  <nav aria-label="Choix de la langue" class="language-switcher">
   <button aria-pressed="false" class="language-choice" data-lang="fr" type="button">
    <img alt="" src="blason-france.svg"/>
    <span class="language-label" data-label-eu="frantsesez" data-label-fr="français">
     français
    </span>
   </button>
   <button aria-pressed="false" class="language-choice" data-lang="eu" type="button">
    <img alt="" src="blason-navarre.svg"/>
    <span class="language-label" data-label-eu="eskuaraz" data-label-fr="basque">
     basque
    </span>
   </button>
  </nav>
  <main>
   <h1>
    <span data-eu="Gurekin harremanetan jarri" data-fr="Nous contacter">
     Nous contacter
    </span>
   </h1>
   <p class="introduction">
    <span data-eu="Obrari, eskatzea bati edo bidalketa bati buruzko edozoin galderatarako, bete formulario hau." data-fr="Pour toute question concernant l’ouvrage, une commande ou une livraison, remplissez ce formulaire.">
     Pour toute question concernant l’ouvrage, une commande ou une livraison, remplissez ce formulaire.
    </span>
   </p>
   <form id="formulaireContact" method="post" target="reponseInvisible">
    <input name="type" type="hidden" value="contact"/>
    <div class="champ">
     <label for="prenom">
      <span data-eu="Izena *" data-fr="Prénom *">
       Prénom *
      </span>
     </label>
     <input id="prenom" name="prenom" required="" type="text"/>
    </div>
    <div class="champ">
     <label for="nom">
      <span data-eu="Deitura *" data-fr="Nom *">
       Nom *
      </span>
     </label>
     <input id="nom" name="nom" required="" type="text"/>
    </div>
    <div class="champ">
     <label for="email">
      <span data-eu="Helbide elektronikoa *" data-fr="Adresse électronique *">
       Adresse électronique *
      </span>
     </label>
     <input id="email" name="email" required="" type="email"/>
    </div>
    <div class="champ">
     <label for="objet">
      <span data-eu="Gaia *" data-fr="Objet *">
       Objet *
      </span>
     </label>
     <select id="objet" name="objet" required="">
      <option data-eu="Hautatu" data-fr="Choisissez" value="">
       Choisissez
      </option>
      <option data-eu="Liburuari buruzko galdera" data-fr="Question sur le livre">
       Question sur le livre
      </option>
      <option data-eu="Eskatzea bati buruzko galdera" data-fr="Question sur une commande">
       Question sur une commande
      </option>
      <option data-eu="Bidalketa bati buruzko galdera" data-fr="Question sur une livraison">
       Question sur une livraison
      </option>
      <option data-eu="Bertze eskatzea bat" data-fr="Autre demande">
       Autre demande
      </option>
     </select>
    </div>
    <div class="champ">
     <label for="message">
      <span data-eu="Zure mezua *" data-fr="Votre message *">
       Votre message *
      </span>
     </label>
     <textarea id="message" name="message" required=""></textarea>
    </div>
    <button type="submit">
     <span data-eu="Mezua bidali" data-fr="Envoyer le message">
      Envoyer le message
     </span>
    </button>
    <p id="messageEtat">
    </p>
   </form>
   <iframe hidden="" name="reponseInvisible" title="Réponse du formulaire">
   </iframe>
   <a class="retour" href="livre.html">
    <span data-eu="← Liburuaren erakuspenarat itzuli" data-fr="← Retour à la présentation du livre">
     ← Retour à la présentation du livre
    </span>
   </a>
  </main>
  <script>
   "use strict";const URL_APPS_SCRIPT="COLLEZ_ICI_URL_APPS_SCRIPT";const f=document.getElementById("formulaireContact"),m=document.getElementById("messageEtat");f.action=URL_APPS_SCRIPT;f.addEventListener("submit",e=>{if(URL_APPS_SCRIPT.includes("COLLEZ_ICI")){e.preventDefault();m.textContent="Le formulaire doit encore être relié à Google Apps Script.";return}m.textContent="Envoi du message…";setTimeout(()=>{m.textContent="Votre message a été transmis.";f.reset()},1000)});
  </script>
  <script src="langues.js">
  </script>
 </body>
</html>
